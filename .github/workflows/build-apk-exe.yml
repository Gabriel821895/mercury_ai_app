name: Build Mercury AI APK and EXE - 100% Online
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Expo prebuild Android
        run: |
          npx expo install expo-splash-screen
          npx expo prebuild --platform android --no-install
          ls -la android/app/src/main/res/values/ || true
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MercuryAI-APK-100-Real
          path: android/app/build/outputs/apk/release/app-release.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Node deps
        run: npm install
      - name: Install Tauri CLI via Cargo (stable)
        run: cargo install tauri-cli --version ^1.5 --locked
      - name: Check Tauri project exists
        run: |
          dir
          dir src-tauri || echo "src-tauri not exists, will init"
        shell: pwsh
      - name: Tauri Init if missing (PowerShell safe)
        run: |
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            Write-Host "Init Tauri project..."
            cargo tauri init --ci --app-name "Mercury AI" --window-title "Mercury AI" --dist-dir "../dist" --dev-path "http://localhost:1420"
          } else {
            Write-Host "src-tauri/tauri.conf.json already exists"
          }
        shell: pwsh
      - name: Build EXE with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./
          args: --verbose
      - name: Upload EXE MSI
        uses: actions/upload-artifact@v4
        with:
          name: MercuryAI-EXE-8MB
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/exe/*.exe
