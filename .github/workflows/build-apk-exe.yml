name: Build Mercury AI APK and EXE - FIX 2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies + splash-screen
        run: |
          npm install
          npm install expo-splash-screen
      - name: Expo prebuild Android
        run: npx expo prebuild --platform android --clean
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MercuryAI-APK-100-Real
          path: android/app/build/outputs/apk/release/app-release.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node deps
        run: npm install
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Init Tauri
        run: npx @tauri/cli init --ci --app-name "Mercury AI" --window-title "Mercury AI"
      - name: Build EXE
        run: npx @tauri/cli build
      - name: Upload EXE MSI
        uses: actions/upload-artifact@v4
        with:
          name: MercuryAI-EXE-8MB
          path: src-tauri/target/release/bundle/msi/*.msi
