name: Build Mercury AI APK and EXE - 100% Online
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Expo prebuild Android (fix splashscreen)
        run: |
          npx expo install expo-splash-screen
          npx expo prebuild --platform android --no-install
          ls -la android/app/src/main/res/values/ || true
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MercuryAI-APK-100-Real
          path: android/app/build/outputs/apk/release/app-release.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node deps
        run: npm install
      - name: Install Tauri CLI via Cargo
        run: cargo install tauri-cli --locked
      - name: Init Tauri if missing
        run: |
          if (-not (Test-Path src-tauri/tauri.conf.json)) {
            cargo tauri init --ci --app-name "Mercury AI" --window-title "Mercury AI"
          }
        shell: pwsh
      - name: Build EXE
        run: cargo tauri build --verbose
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MercuryAI-EXE-8MB
          path: src-tauri/target/release/bundle/msi/*.msi
